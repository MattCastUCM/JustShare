[project]
name = "justshare"
version = "1.0.0"
description = "A serious game to raise awareness about grooming, which uses different NLP techniques to simulate free choice."
requires-python = ">=3.12"
dependencies = [
    "autocorrect>=2.6.1",
    "fastapi[standard]>=0.128.0",
    "gensim>=4.4.0",
    "langchain-ollama>=1.0.1",
    "loguru>=0.7.3",
    "nltk>=3.9.2",
    "numpy>=2.4.1",
    "pydantic-settings>=2.12.0",
    "spacy>=3.8.11",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pip>=26.0",
]
